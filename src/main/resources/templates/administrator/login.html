<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>従業員管理システム</title>
    <link rel="stylesheet" href="../../static/css/bootstrap.css" th:href="@{/css/bootstrap.css}"/>
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-lg-offset-0 col-lg-6 col-md-8 col-sm-10 col-xs-12">
            <img src="../../static/img/header_logo.png" th:src="@{/img/header_logo.png}"/>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-offset-3 col-lg-6 col-md-offset-2 col-md-8 col-sm-10 col-xs-12">
            <div class="well">
                <form method="post" th:action="@{/login}">
                    <fieldset>
                        <legend>ログイン</legend>
                        <div th:if="${param.error}" class="alert alert-danger">
                            <p>メールアドレスまたはパスワードが不正です。</p>
                        </div>
                        <div th:if="${infoMessage}" class="alert alert-info">
                            <p th:text="${infoMessage}">完了メッセージ</p>
                        </div>
                        <div class="form-group">
                            <label for="mailAddress">メールアドレス:</label>
                            <input type="text" name="mailAddress" id="mailAddress" class="form-control" placeholder="Email"/>
                        </div>
                        <div class="form-group">
                            <label for="password">パスワード:</label>
                            <input type="password" name="password" id="password" class="form-control" placeholder="Password"/>
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">ログイン</button>
                        </div>
                        <div class="form-group">
                            <a th:href="@{/toInsert}">管理者登録はこちらから</a>
                        </div>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
<script src="../../static/js/bootstrap.min.js"></script>
</body>
</html>
