<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>500 システム再起動中</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}" />
    <style>
        /* 警告をイメージさせるダークレッド系の動く背景 */
        body {
            background: linear-gradient(-45deg, #090d16, #201111, #111827, #090d16);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .error-container {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 60px 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* 警告オレンジのネオン500 */
        .code-neon {
            font-size: 110px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 5px;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 10px #f97316, 0 0 30px #f97316, 0 0 60px #f97316;
            animation: pulseWarning 2.5s ease-in-out infinite;
        }

        @keyframes pulseWarning {
            0%, 100% { transform: scale(1); text-shadow: 0 0 10px #f97316, 0 0 20px #f97316; }
            50% { transform: scale(1.02); text-shadow: 0 0 15px #fb923c, 0 0 40px #fb923c, 0 0 70px #fb923c; }
        }

        .title-text {
            color: #e2e8f0;
            font-size: 22px;
            font-weight: bold;
            margin-top: 25px;
        }

        .desc-text {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        /* 警告色のサイバーボタン */
        .btn-cyber {
            background: linear-gradient(135deg, #f97316, #ef4444);
            color: white !important;
            border: none;
            border-radius: 30px;
            padding: 12px 35px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
        }

        .btn-cyber:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.6);
            background: linear-gradient(135deg, #fb923c, #f87171);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="code-neon">500</h1>
        <p class="title-text">コアシステム、一時的な限界です</p>
        <p class="desc-text">
            ただいまエンジニアが裏側で復旧シークエンスを実行中です。<br>
            データは保護されていますので、安心してください。<br>
            しばらく時間を置いてから再度アクセスをお願いします。
        </p>
        <a th:href="@{/}" class="btn btn-cyber btn-lg">
            <span class="glyphicon glyphicon-flash" aria-hidden="true"></span> ゲートウェイに戻る
        </a>
    </div>
</body>
</html>
