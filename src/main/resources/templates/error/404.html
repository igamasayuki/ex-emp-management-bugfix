<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>404 次元迷子</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}" />
    <style>
        /* 動く宇宙グラデーション背景 */
        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #2e1065, #0f172a);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ガラスモーフィズム（半透明の近未来カード） */
        .error-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 60px 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* ネオンのように輝く404 */
        .code-neon {
            font-size: 110px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 5px;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 10px #a855f7, 0 0 30px #a855f7, 0 0 60px #a855f7;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7; }
            50% { transform: scale(1.03); text-shadow: 0 0 15px #c084fc, 0 0 40px #c084fc, 0 0 70px #c084fc; }
        }

        .title-text {
            color: #e2e8f0;
            font-size: 22px;
            font-weight: bold;
            margin-top: 25px;
        }

        .desc-text {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        /* サイバー感のあるグラデーションボタン */
        .btn-cyber {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white !important;
            border: none;
            border-radius: 30px;
            padding: 12px 35px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .btn-cyber:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.6);
            background: linear-gradient(135deg, #c084fc, #818cf8);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="code-neon">404</h1>
        <p class="title-text">世界の果てに迷い込みました</p>
        <p class="desc-text">
            あなたがアクセスしようとしたページは、<br>
            別の世界線に移動したか、最初から存在しないようです。
        </p>
        <a th:href="@{/}" class="btn btn-cyber btn-lg">
            <span class="glyphicon glyphicon-planet" aria-hidden="true"></span> 安全なエリアに戻る
        </a>
    </div>
</body>
</html>
