<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>従業員管理システム</title>
    <link rel="stylesheet" href="../../static/css/bootstrap.css" th:href="@{/css/bootstrap.css}" />
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}" />
</head>
<body>
<div class="container">
    <nav class="navbar navbar-default">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1" aria-expanded="false">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span> <span class="icon-bar"></span> <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="list.html" th:href="@{/junior/employee/showList}">
                    <img src="../../static/img/header_logo_small.png" th:src="@{/img/header_logo_small.png}" />
                </a>
            </div>
            <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
                <ul class="nav navbar-nav">
                    <li class="active">
                        <a href="list.html" th:href="@{/junior/employee/showList}">従業員管理</a>
                    </li>
                </ul>
                <p class="navbar-text navbar-right">
                    <span th:if="${session.administratorName != null}" th:text="${session.administratorName}">山田太郎</span>
                    <span th:if="${session.administratorName == null}">山田太郎</span>さんこんにちは！ &nbsp;&nbsp;&nbsp;
                    <a href="../administrator/login.html" class="navbar-link" th:href="@{/logout}">ログアウト</a>
                </p>
            </div>
        </div>
    </nav>

    <ol class="breadcrumb">
        <li class="active">
            <a href="list.html" th:href="@{/junior/employee/showList}">従業員リスト</a>
        </li>
    </ol>

    <div class="row">
        <div class="table-responsive col-lg-offset-2 col-lg-8 col-md-offset-2 col-md-8 col-sm-12 col-xs-12">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>従業員名</th>
                    <th>入社日</th>
                    <th>扶養人数</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="employee : ${employeeList}">
                    <td>
                        <a href="detail.html" th:href="@{'/junior/employee/showDetail?id=' + ${employee.id}}">
                            <span th:text="${employee.name}">山田太郎</span>
                        </a>
                    </td>
                    <td>
                        <!-- (4-1) 初級 日付フォーマット: yyyy年MM月dd日 -->
                        <span th:text="${#dates.format(employee.hireDate, 'yyyy年MM月dd日')}">2016年12月01日</span>
                    </td>
                    <td>
                        <span th:text="${employee.dependentsCount} + '人'">3人</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
<script src="../../static/js/bootstrap.min.js"></script>
</body>
</html>
