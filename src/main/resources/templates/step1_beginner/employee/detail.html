<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>従業員管理システム</title>
    <link rel="stylesheet" href="../../static/css/bootstrap.css" th:href="@{/css/bootstrap.css}" />
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}" />
</head>
<body>
<div class="container">
    <nav class="navbar navbar-default">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1" aria-expanded="false">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span> <span class="icon-bar"></span> <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="list.html" th:href="@{/junior/employee/showList}">
                    <img src="../../static/img/header_logo_small.png" th:src="@{/img/header_logo_small.png}" />
                </a>
            </div>
            <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
                <ul class="nav navbar-nav">
                    <li class="active">
                        <a href="list.html" th:href="@{/junior/employee/showList}">従業員管理</a>
                    </li>
                </ul>
                <p class="navbar-text navbar-right">
                    <span th:if="${session.administratorName != null}" th:text="${session.administratorName}">山田太郎</span>
                    <span th:if="${session.administratorName == null}">山田太郎</span>さんこんにちは！ &nbsp;&nbsp;&nbsp;
                    <a href="../administrator/login.html" class="navbar-link" th:href="@{/logout}">ログアウト</a>
                </p>
            </div>
        </div>
    </nav>

    <ol class="breadcrumb">
        <li>
            <a href="list.html" th:href="@{/junior/employee/showList}">従業員リスト</a>
        </li>
        <li class="active">従業員詳細</li>
    </ol>

    <div class="row">
        <div class="col-lg-offset-2 col-lg-8 col-md-offset-2 col-md-8 col-sm-12 col-xs-12">
            <div class="well">
                <form method="post" action="list.html" th:action="@{/junior/employee/update}" th:object="${updateEmployeeForm}">
                    <fieldset>
                        <legend>従業員情報</legend>
                        <table class="table table-striped">
                            <tr>
                                <th nowrap>従業員名</th>
                                <td><span th:text="${employee.name}">山田花子</span></td>
                            </tr>
                            <tr>
                                <th nowrap>写真</th>
                                <td><img src="../../static/img/e2.png" th:src="${'/img/' + employee.image}" /></td>
                            </tr>
                            <tr>
                                <th nowrap>性別</th>
                                <td><span th:text="${employee.gender}">女性</span></td>
                            </tr>
                            <tr>
                                <th nowrap>入社日</th>
                                <td>
                                    <!-- (4-1) 初級 日付フォーマット: yyyy年MM月dd日 -->
                                    <span th:text="${#dates.format(employee.hireDate, 'yyyy年MM月dd日')}">2012年11月29日</span>
                                </td>
                            </tr>
                            <tr>
                                <th nowrap>メールアドレス</th>
                                <td><span th:text="${employee.mailAddress}">yamada@sample.com</span></td>
                            </tr>
                            <tr>
                                <th nowrap>郵便番号</th>
                                <td><span th:text="${employee.zipCode}">111-1111</span></td>
                            </tr>
                            <tr>
                                <th nowrap>住所</th>
                                <td><span th:text="${employee.address}">東京都新宿区1-1-1</span></td>
                            </tr>
                            <tr>
                                <th nowrap>電話番号</th>
                                <td><span th:text="${employee.telephone}">090-0000-0000</span></td>
                            </tr>
                            <tr>
                                <th nowrap>給料</th>
                                <td>
                                    <!-- (4-2) 初級 価格フォーマット: 3桁カンマ区切り＋円 -->
                                    <span th:text="${#numbers.formatInteger(employee.salary, 3, 'COMMA')} + '円'">400,000円</span>
                                </td>
                            </tr>
                            <tr>
                                <th nowrap>特性</th>
                                <td><span th:text="${employee.characteristics}">特性テキスト</span></td>
                            </tr>
                            <tr>
                                <th nowrap>扶養人数</th>
                                <td>
                                    <label th:errors="*{dependentsCount}" class="error-messages">扶養人数を入力してください</label>
                                    <input type="hidden" name="id" th:value="${employee.id}" />
                                    <input type="text" name="dependentsCount" id="dependentsCount" class="form-control" th:errorclass="error-input" th:value="${employee.dependentsCount}" />
                                </td>
                            </tr>
                        </table>
                        <button type="submit" class="btn btn-primary">更新</button>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
<script src="../../static/js/bootstrap.min.js"></script>
</body>
</html>
