<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
    <!-- ヘッダーフラグメント -->
    <nav th:fragment="header" class="navbar navbar-default">
        <div class="container-fluid">
            <div class="navbar-header">
                <a class="navbar-brand" th:href="@{/middleEmployee/showList}">
                    <img src="../../../static/img/header_logo_small.png" th:src="@{/img/header_logo_small.png}" alt="ロゴ">
                </a>
            </div>
            <div class="collapse navbar-collapse">
                <ul class="nav navbar-nav">
                    <li class="active">
                        <a th:href="@{/middleEmployee/showList}">従業員管理</a>
                    </li>
                </ul>
                <p class="navbar-text navbar-right">
                    <!-- (2-1) ログイン者名表示：セッションから取得 -->
                    <span th:if="${session.administratorName != null}">
                        <span th:text="${session.administratorName} + 'さん こんにちは！'"></span>
                    </span>
                    <span th:if="${session.administratorName == null}">
                        ゲストさん こんにちは！
                    </span>
                    &nbsp;&nbsp;
                    <a th:href="@{/logout}" class="navbar-link">ログアウト</a>
                </p>
            </div>
        </div>
    </nav>
</body>
</html>
