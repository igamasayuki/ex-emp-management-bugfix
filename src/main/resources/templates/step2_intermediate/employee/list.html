<!DOCTYPE html>
<html
        lang="ja"
        xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>従業員管理システム</title>
    <link
            rel="stylesheet"
            href="../../../static/css/bootstrap.css"
            th:href="@{/css/bootstrap.css}"
    />
    <link
            rel="stylesheet"
            href="../../../static/css/style.css"
            th:href="@{/css/style.css}"
    />
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<div class="container">
    <!-- 共通ヘッダーを読み込み -->
    <div th:replace="~{step2_intermediate/common/header :: header}"></div>

    <!-- パンくずリスト -->
    <ol class="breadcrumb">
        <li class="active">
            <a href="list.html" th:href="@{/middleEmployee/showList}">従業員リスト</a>
        </li>
    </ol>

    <!-- (6-2) 検索フォーム -->
    <div class="row">
        <div class="col-lg-offset-2 col-lg-8 col-md-offset-2 col-md-8 col-sm-12 col-xs-12">
            <div class="well">
                <form method="get" th:action="@{/middleEmployee/search}" class="form-inline">
                    <div class="form-group">
                        <label for="name">従業員名：</label>
                        <input type="text" name="name" id="name" class="form-control input-sm" placeholder="名前の一部を入力">
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">検索</button>
                    <a th:href="@{/middleEmployee/showList}" class="btn btn-default btn-sm">クリア</a>
                </form>
            </div>
            <!-- 検索結果メッセージ -->
            <div th:if="${message}" class="alert alert-warning" role="alert">
                <span th:text="${message}">検索結果メッセージ</span>
            </div>
        </div>
    </div>

    <!-- table -->
    <div class="row">
        <div
                class="table-responsive col-lg-offset-2 col-lg-8 col-md-offset-2 col-md-8 col-sm-12 col-xs-12"
        >
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>従業員名</th>
                    <th>入社日</th>
                    <th>扶養人数</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="employee : ${employeeList}">
                    <td>
                        <a
                                href="detail.html"
                                th:href="@{'/middleEmployee/showDetail?id=' + ${employee.id}}"
                        >
                            <span th:text="${employee.name}">山田太郎</span>
                        </a>
                    </td>
                    <td>
                        <!-- (4-1) 初級で対応済みのフォーマット -->
                        <span th:text="${#dates.format(employee.hireDate, 'yyyy年MM月dd日')}">2016/12/1</span>
                    </td>
                    <td>
                        <span th:text="${employee.dependentsCount} + '人'">3人</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<!-- end container -->

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
