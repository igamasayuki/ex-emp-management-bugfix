<!DOCTYPE html>
<html
        lang="ja"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>従業員管理システム</title>
    <link
            rel="stylesheet"
            href="../../static/css/bootstrap.css"
            th:href="@{/css/bootstrap.css}"
    />
    <link
            rel="stylesheet"
            href="../../static/css/style.css"
            th:href="@{/css/style.css}"
    />
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<div class="container">
    <nav class="navbar navbar-default">
        <div class="container-fluid">
            <!-- Brand and toggle get grouped for better mobile display -->
            <div class="navbar-header">
                <button
                        type="button"
                        class="navbar-toggle collapsed"
                        data-toggle="collapse"
                        data-target="#bs-example-navbar-collapse-1"
                        aria-expanded="false"
                >
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span> <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a
                        class="navbar-brand"
                        href="list.html"
                        th:href="@{/employee/showList}"
                >
                    <!-- 企業ロゴ -->
                    <img
                            src="../../static/img/header_logo_small.png"
                            th:src="@{/img/header_logo_small.png}"
                    />
                </a>
            </div>

            <!-- Collect the nav links, forms, and other content for toggling -->
            <div
                    class="collapse navbar-collapse"
                    id="bs-example-navbar-collapse-1"
            >
                <ul class="nav navbar-nav">
                    <li class="active">
                        <a href="list.html" th:href="@{/employee/showList}"
                        >従業員管理</a
                        >
                    </li>
                    <li class="active">
                        <a href="list.html" th:href="@{/employee/insert}"
                        >従業員登録</a
                        >
                    </li>
                </ul>
                <p class="navbar-text navbar-right">
              <span sec:authentication="principal.administrator.name">山田太郎</span
              >さんこんにちは！ &nbsp;&nbsp;&nbsp;
                    <a
                            href="../administrator/login.html"
                            class="navbar-link"
                            th:href="@{/logout}"
                    >ログアウト</a
                    >
                </p>
            </div>
            <!-- /.navbar-collapse -->
        </div>
        <!-- /.container-fluid -->
    </nav>

    <!-- パンくずリスト -->
    <ol class="breadcrumb">
        <li><a th:href="@{/employee/showList}">従業員リスト</a></li>
        <li class="active">従業員登録</li>
    </ol>

    <!-- register form -->
    <div class="row">
        <div
                class="col-lg-offset-2 col-lg-8 col-md-offset-2 col-md-8 col-sm-12 col-xs-12"
        >
            <!-- 背景をグレーに、埋め込んだようなコンポーネント -->
            <div class="well">
                <!-- ここから上を編集する必要はありません -->

                <!-- ここにモックのform要素を貼り付けます -->

                <form
                        method="post"
                        action="login.html"
                        th:action="@{/employee/save}"
                        th:object="${insertEmployeeForm}"
                        enctype="multipart/form-data"
                >
                    <fieldset>
                        <legend>
                            従業員登録
                        </legend>
                        <!-- 氏名 -->
                        <div class="form-group">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label for="name"> 氏名: </label>
                                    <label
                                            th:errors="*{name}"
                                            class="error-messages"
                                    >
                                        氏名を入力してください
                                    </label>
                                    <input
                                            type="text"
                                            name="name"
                                            id="name"
                                            class="form-control"
                                            placeholder="山田太郎"
                                            th:field="*{name}"
                                            th:errorclass="error-input"
                                            value="山田太郎"
                                    />
                                </div>
                            </div>
                        </div>
                        <!--　 画像-->
                        <div class="">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label for="image">画像：</label>
                                    <label
                                            th:errors="*{image}"
                                            class="error-messages"
                                    >
                                        画像をアップロードしてください
                                    </label>
                                    <input
                                            type="file"
                                            name="image"
                                            id="image"
                                    >
                                </div>
                            </div>
                        </div>
                        <!-- 性別 -->
                        <div class="form-group">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label>性別</label>
                                    <br>
                                    <label
                                        th:errors="*{gender}"
                                        class="error-messages"
                                    >
                                        性別を選択してください
                                    </label>
                                    <span th:each="gender: ${genders}">
                                        <label th:for="gender + ${gender.key}">
                                            <input
                                                    type="radio"
                                                    name="gender"
                                                    th:id="gender + ${gender.key}"
                                                    th:value="${gender.key}"
                                                    th:text="${gender.value}"
                                            >
                                        </label>
                                        &nbsp
                                    </span>
                                </div>
                            </div>
                        </div>
                        <!-- 入社日 -->
                        <div class="form-group">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label for="hire_date">入社日：</label>
                                    <br>
                                    <label
                                            th:errors="*{hireDate}"
                                            class="error-messages"
                                    >
                                        入社日を入力してください
                                    </label>
                                    <input
                                        type="date"
                                        name="hireDate"
                                        id="hire_date"
                                        th:field="*{hireDate}"
                                        th:errorclass="error-input"
                                    >
                                </div>
                            </div>
                        </div>
                        <!-- メールアドレス -->
                        <div class="form-group">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label for="mailAddress"> メールアドレス: </label>
                                    <label
                                            th:errors="*{mailAddress}"
                                            class="error-messages"
                                    >
                                        メールアドレスを入力してください
                                    </label>
                                    <input
                                            type="text"
                                            name="mailAddress"
                                            id="mailAddress"
                                            class="form-control"
                                            placeholder="yamada@mail.com"
                                            th:field="*{mailAddress}"
                                            th:errorclass="error-input"
                                            value="yamada@mail.com"
                                    />
                                </div>
                            </div>
                        </div>

                        <!-- 郵便番号 -->
                        <div class="form-group">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label for="zipCode"> 郵便番号:
                                        <button type="button" id="zipCodeBtn">住所検索</button>
                                    </label>
                                    <label
                                            th:errors="*{zipCode}"
                                            class="error-messages"
                                    >
                                        郵便番号を入力してください
                                    </label>
                                    <input
                                        type="text"
                                        name="zipCode"
                                        id="zipCode"
                                        class="form-control"
                                        placeholder="000-0000"
                                        th:field="*{zipCode}"
                                        th:errorclass="error-input"
                                    >
                                </div>
                            </div>
                        </div>

                        <!-- 住所 -->
                        <div class="form-group">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label for="address1"> 住所:</label>
                                    <label
                                            th:errors="*{address}"
                                            class="error-messages"
                                    >
                                        住所を入力してください
                                    </label>
                                    <input
                                            type="text"
                                            name="address1"
                                            id="address1"
                                            class="form-control"
                                            placeholder="市町村まで"
                                            th:field="*{address}"
                                            th:errorclass="error-input"
                                    >
                                    <br>
                                    以降の住所：
                                    <br>
                                    <input
                                            type="text"
                                            name="address2"
                                            id="address2"
                                            class="form-control"
                                    >
                                </div>
                            </div>
                        </div>

                        <!-- 電話番号 -->
                        <div class="form-group">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label for="telephone"> 電話番号（ハイフン含める）:</label>
                                    <label
                                            th:errors="*{telephone}"
                                            class="error-messages"
                                    >
                                        電話番号を入力してください
                                    </label>
                                    <input
                                            type="text"
                                            name="telephone"
                                            id="telephone"
                                            class="form-control"
                                            placeholder="000-0000-0000"
                                            th:field="*{telephone}"
                                            th:errorclass="error-input"
                                    >
                                </div>
                            </div>
                        </div>
                        <!-- 給料 -->
                        <div class="form-group">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label for="salary"> 給料：</label>
                                    <label
                                            th:errors="*{salary}"
                                            class="error-messages"
                                    >
                                        給料を入力してください
                                    </label>
                                    <input
                                            type="text"
                                            name="salary"
                                            id="salary"
                                            class="form-control"
                                            th:field="*{salary}"
                                            th:errorclass="error-input"
                                    >
                                </div>
                            </div>
                        </div>
                        <!-- 特徴 -->
                        <div class="form-group">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label for="zipCode"> 特徴：</label>
                                    <label
                                            th:errors="*{characteristics}"
                                            class="error-messages"
                                    >
                                        特徴を入力してください
                                    </label>
                                    <textarea
                                        name="characteristics"
                                        class="form-control"
                                        th:field="*{characteristics}"
                                    ></textarea>
                                </div>
                            </div>
                        </div>
                        <!-- 扶養人数 -->
                        <div class="form-group">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label for="dependentsCount"> 扶養人数：</label>
                                    <label
                                            th:errors="*{dependentsCount}"
                                            class="error-messages"
                                    >
                                        扶養人数を入力してください
                                    </label>
                                    <input
                                        type="text"
                                        name="dependentsCount"
                                        id="dependentsCount"
                                        class="form-control"
                                        th:field="*{dependentsCount}"
                                        th:errorclass="error-input"
                                    >
                                </div>
                            </div>
                        </div>
                        <!-- 登録ボタン -->
                        <div class="form-group">
                            <div class="row">
                                <div class="col-sm-12">
                                    <button type="submit" class="btn btn-primary">
                                        登録
                                    </button>
                                </div>
                            </div>
                        </div>
                    </fieldset>
                </form>

                <!-- ここから下を編集する必要はありません -->
            </div>
        </div>
    </div>
</div>
<!-- end container -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
<script src="../../static/js/bootstrap.min.js"></script>
<script th:src="@{/js/zipcode.js}"></script>
</body>
</html>
