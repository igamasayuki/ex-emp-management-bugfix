<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>従業員登録</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <nav class="navbar navbar-default">
        <div class="container-fluid">
            <ul class="nav navbar-nav">
                <li><a th:href="@{/employee/showList}">従業員管理</a></li>
                <li class="active"><a th:href="@{/employee/toInsert}">従業員登録</a></li>
            </ul>
        </div>
    </nav>

    <div class="well">
        <h1>従業員登録</h1>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <p th:text="${errorMessage}">入力内容を確認してください。</p>
        </div>
        <!-- 画像を送るため、formにはenctype="multipart/form-data"が必要。 -->
        <form method="post" th:action="@{/employee/insert}" th:object="${insertEmployeeForm}" enctype="multipart/form-data">
            <div class="form-group">
                <label>従業員名</label>
                <input type="text" class="form-control" th:field="*{name}" required/>
            </div>
            <div class="form-group">
                <label>写真(jpg/png)</label>
                <input type="file" class="form-control" th:field="*{imageFile}" accept=".jpg,.jpeg,.png"/>
            </div>
            <div class="form-group">
                <label>性別</label>
                <select class="form-control" th:field="*{gender}">
                    <option value="男性">男性</option>
                    <option value="女性">女性</option>
                </select>
            </div>
            <div class="form-group">
                <label>入社日</label>
                <input type="date" class="form-control" th:field="*{hireDate}" required/>
            </div>
            <div class="form-group">
                <label>メールアドレス</label>
                <input type="email" class="form-control" th:field="*{mailAddress}" required/>
            </div>
            <div class="form-group">
                <label>郵便番号</label>
                <input type="text" class="form-control" th:field="*{zipCode}" id="zipCode" required/>
            </div>
            <div class="form-group">
                <label>住所</label>
                <input type="text" class="form-control" th:field="*{address}" id="address" required/>
            </div>
            <div class="form-group">
                <label>電話番号</label>
                <input type="text" class="form-control" th:field="*{telephone}" required/>
            </div>
            <div class="form-group">
                <label>給料</label>
                <input type="number" class="form-control" th:field="*{salary}" required/>
            </div>
            <div class="form-group">
                <label>特性</label>
                <textarea class="form-control" th:field="*{characteristics}" required></textarea>
            </div>
            <div class="form-group">
                <label>扶養人数</label>
                <input type="number" class="form-control" th:field="*{dependentsCount}" value="0" required/>
            </div>
            <button type="submit" class="btn btn-primary">登録</button>
        </form>
    </div>
</div>
<script>
    document.getElementById("zipCode").addEventListener("blur", async function () {
        const zipCode = this.value.replace("-", "");
        if (!zipCode) return;
        // 郵便番号APIで住所候補を取得し、手入力の手間を減らす。
        const response = await fetch("https://zipcloud.ibsnet.co.jp/api/search?zipcode=" + zipCode);
        const data = await response.json();
        if (data.results && data.results.length > 0) {
            const result = data.results[0];
            document.getElementById("address").value = result.address1 + result.address2 + result.address3;
        }
    });
</script>
</body>
</html>
