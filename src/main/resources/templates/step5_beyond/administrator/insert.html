<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>管理者登録（step5）</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="row"><div class="col-lg-6"><img th:src="@{/img/header_logo.png}" alt="ロゴ"/></div></div>
    <div class="row">
        <div class="col-lg-offset-3 col-lg-6">
            <div class="well">
                <form method="post" th:action="@{/beyond/insert}" th:object="${beyondInsertAdministratorForm}">
                    <fieldset>
                        <legend>管理者登録（step5）</legend>
                        <div class="form-group">
                            <label for="name">氏名</label>
                            <label th:errors="*{name}" class="error-messages"></label>
                            <input type="text" th:field="*{name}" id="name" class="form-control"/>
                        </div>
                        <div class="form-group">
                            <label for="mailAddress">メール</label>
                            <label th:errors="*{mailAddress}" class="error-messages"></label>
                            <input type="text" th:field="*{mailAddress}" id="mailAddress" class="form-control"/>
                        </div>
                        <div class="form-group">
                            <label for="password">パスワード</label>
                            <label th:errors="*{password}" class="error-messages"></label>
                            <input type="password" th:field="*{password}" id="password" class="form-control"/>
                        </div>
                        <div class="form-group">
                            <label for="passwordConfirm">確認用</label>
                            <label th:errors="*{passwordConfirm}" class="error-messages"></label>
                            <input type="password" th:field="*{passwordConfirm}" id="passwordConfirm" class="form-control"/>
                        </div>
                        <button type="submit" class="btn btn-primary">登録</button>
                        <a th:href="@{/beyond/}" class="btn btn-link">ログインへ</a>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
