<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>ログイン（step5 追加課題）</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-lg-6"><img th:src="@{/img/header_logo.png}" alt="ロゴ"/></div>
    </div>
    <div class="row">
        <div class="col-lg-offset-3 col-lg-6">
            <div class="well">
                <form method="post" th:action="@{/beyond/login}">
                    <fieldset>
                        <legend>ログイン（追加課題 完成形）</legend>
                        <div th:if="${errorMessage}" class="alert alert-danger">
                            <span th:text="#{${errorMessage}}">エラー</span>
                        </div>
                        <div th:if="${infoMessage}" class="alert alert-info">
                            <span th:text="#{${infoMessage}}">情報</span>
                        </div>
                        <div th:if="${logoutMessage}" class="alert alert-info">
                            <span th:text="#{${logoutMessage}}">ログアウト</span>
                        </div>
                        <div class="form-group">
                            <label for="mailAddress">メールアドレス</label>
                            <input type="text" name="mailAddress" id="mailAddress" class="form-control" required/>
                        </div>
                        <div class="form-group">
                            <label for="password">パスワード</label>
                            <input type="password" name="password" id="password" class="form-control" required/>
                        </div>
                        <button type="submit" class="btn btn-primary">ログイン</button>
                        <p><a th:href="@{/beyond/toInsert}">管理者登録はこちら</a></p>
                        <p class="text-muted">入口: /beyond/ → 一覧: /beyondEmployee/showList</p>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
