<!DOCTYPE html>
<html
        lang="ja"
        xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>従業員管理システム</title>
    <link
            rel="stylesheet"
            href="../../../static/css/bootstrap.css"
            th:href="@{/css/bootstrap.css}"
    />
    <link
            rel="stylesheet"
            href="../../../static/css/style.css"
            th:href="@{/css/style.css}"
    />
</head>
<body>
<div class="container">
    <div th:replace="~{step2_intermediate/common/header :: header}"></div>

    <ol class="breadcrumb">
        <li class="active">従業員リスト</li>
    </ol>

    <!-- 検索フォーム等は中級のものを流用可能ですが、ここでは簡略化 -->
    <div class="row" style="margin-bottom: 20px;">
        <div class="col-md-12 text-right">
            <!-- (6-3) 従業員登録ボタンの追加 -->
            <a th:href="@{/advanceEmployee/toInsert}" class="btn btn-success">新規従業員登録</a>
        </div>
    </div>

    <div class="row">
        <div class="table-responsive col-lg-offset-2 col-lg-8 col-md-offset-2 col-md-8 col-sm-12 col-xs-12">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>従業員名</th>
                    <th>入社日</th>
                    <th>扶養人数</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="employee : ${employeeList}">
                    <td>
                        <span th:text="${employee.name}">山田太郎</span>
                    </td>
                    <td>
                        <span th:text="${#dates.format(employee.hireDate, 'yyyy年MM月dd日')}">2016/12/1</span>
                    </td>
                    <td>
                        <span th:text="${employee.dependentsCount} + '人'">3人</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
