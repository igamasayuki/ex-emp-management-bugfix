<!DOCTYPE html>
<html
        lang="ja"
        xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>従業員管理システム</title>
    <link
            rel="stylesheet"
            href="../../../static/css/bootstrap.css"
            th:href="@{/css/bootstrap.css}"
    />
    <link
            rel="stylesheet"
            href="../../../static/css/style.css"
            th:href="@{/css/style.css}"
    />
    <!-- (6-4) jQuery UI 用のCSS -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
</head>
<body>
<div class="container">
    <div th:replace="~{step2_intermediate/common/header :: header}"></div>

    <ol class="breadcrumb">
        <li class="active">従業員リスト</li>
    </ol>

    <div class="row">
        <div class="col-lg-offset-2 col-lg-8 col-md-offset-2 col-md-8 col-sm-12 col-xs-12">
            <!-- (6-4) オートコンプリート：jQuery UI 方式 -->
            <div class="well">
                <form method="get" th:action="@{/advanceEmployee/search}" class="form-inline">
                    <div class="form-group">
                        <label for="name">従業員名：</label>
                        <input type="text" name="name" id="name" class="form-control input-sm" placeholder="名前を入力">
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">検索</button>
                    <a th:href="@{/advanceEmployee/showList}" class="btn btn-default btn-sm">クリア</a>
                </form>
            </div>
        </div>
    </div>

    <div class="row" style="margin-bottom: 20px;">
        <div class="col-md-12 text-right">
            <a th:href="@{/advanceEmployee/toInsert}" class="btn btn-success">新規従業員登録</a>
        </div>
    </div>

    <div class="row">
        <div class="table-responsive col-lg-offset-2 col-lg-8 col-md-offset-2 col-md-8 col-sm-12 col-xs-12">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>従業員名</th>
                    <th>入社日</th>
                    <th>扶養人数</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="employee : ${employeeList}">
                    <td>
                        <span th:text="${employee.name}">山田太郎</span>
                    </td>
                    <td>
                        <span th:text="${#dates.format(employee.hireDate, 'yyyy年MM月dd日')}">2016/12/1</span>
                    </td>
                    <td>
                        <span th:text="${employee.dependentsCount} + '人'">3人</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<!-- (6-4) jQuery UI 用のJS読み込み -->
<script src="https://code.jquery.com/jquery-1.12.4.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>

<script th:inline="javascript">
    $(function() {
        // 全従業員名のリストをサーバーから受け取る
        var availableNames = /*[[${employeeNames}]]*/ [];
        $("#name").autocomplete({
            source: availableNames
        });
    });
</script>
</body>
</html>
